<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Paid Modes</title><style>body{margin:0;background:#02070b;color:#fff;font:14px system-ui}main{max-width:900px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.card{padding:14px;border:1px solid #234451;border-radius:16px;background:#061019}.price{color:#7fe8ff;font-weight:800}.btn{width:100%;padding:11px;margin-top:8px;border-radius:10px;border:1px solid #4be4ff;background:#096d88;color:#fff;font-weight:800}.status{padding:10px;margin:12px 0;border:1px solid #234451;border-radius:12px}.muted{color:#9bb0bd}</style></head><body><main><h1>✦ Universal Paid Modes</h1><p class="muted">Optional paid software simulation upgrades. Object use is always inherent. Unlocks occur only after exact on-chain settlement.</p><div id="status" class="status">Ready.</div><div id="packages" class="grid"></div><h2>Objects — always inherent</h2><p class="muted">Use objects remains a core simulator capability; upgrades add behavior presets.</p><div id="objects"></div><p><a class="muted" href="/atlas.html">← Universal Atlas</a> · <a class="muted" href="/">Telecom</a></p></main><script>
const PACKAGES=[["god","⚡ God Mode",25,"Expanded software-simulation control and compatible layers."],["animal","🐾 Animal Mode",10,"Animal avatar and behavior simulation presets."],["hyperspace","🌠 Hyperspace Mode",25,"High-speed traversal and hyperspace-style visualization."],["hero1","🦸 Superhero I",10,"Flight, jump, strength and hero movement simulation."],["hero2","🦸 Superhero II",25,"Advanced hero traversal and object interaction."],["hero3","🦸 Superhero III",50,"Expanded hero simulation across compatible layers."],["skate","🛹 Skateboard Mode",4,"Skateboard movement, ramps and tricks simulation."],["objects1","🧩 Object Upgrade I",10,"Expanded object behaviors and reusable presets."],["objects2","🧩 Object Upgrade II",25,"Advanced object and multi-object interaction presets."],["all","✦ All Modes Pack",100,"Unlock every paid mode in this catalog for this session."]];
const objects=["primitive","nature","character","vehicle","building","world","gameplay","tech","custom"];const status=document.getElementById("status");const merchant="0x13653b6b8bd4b274da565faf6fa894e3418a6d10";const token="0x833589fcd6edb6e08f4c7c32d4f71b54bda02913";
document.getElementById("packages").innerHTML=PACKAGES.map(p=>'<div class="card"><h2>'+p[1]+'</h2><div class="price">$'+p[2]+'</div><p class="muted">'+p[3]+'</p><button class="btn" data-id="'+p[0]+'">1-Tap Unlock</button></div>').join("");
document.getElementById("objects").innerHTML=objects.map(x=>'<button class="btn" data-object="'+x+'">Use '+x+'</button>').join("");
async function unlock(id){const p=PACKAGES.find(x=>x[0]===id);try{if(!window.ethereum)throw Error("Base-compatible wallet required");const from=(await ethereum.request({method:"eth_requestAccounts"}))[0];await ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:"0x2105"}]});status.textContent="Preparing exact quote for "+p[1]+"…";const q=await fetch("/v1/payments/quote?tokenAddress="+token+"&amountUsd="+p[2],{cache:"no-store"}).then(r=>r.json());if(!q.amount_base_units)throw Error(q.error||"quote unavailable");status.textContent="Exact "+q.amount_human+" USDC to "+merchant+". Approve the exact transfer in your wallet.";const data="0xa9059cbb"+q.amount_base_units.padStart(64,"0");const tx=await ethereum.request({method:"eth_sendTransaction",params:[{from:from,to:token,data:data}]});status.textContent="Submitted "+tx.slice(0,12)+"… verifying…";for(let i=0;i<60;i++){await new Promise(r=>setTimeout(r,2000));const v=await fetch("/v1/payments/verify-transfer",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({txHash:tx,tokenAddress:token,from:from,amountUnits:q.amount_base_units,amountUsd:p[2]})}).then(r=>r.json());if(v.confirmed){localStorage.setItem("mode:"+id,tx);status.textContent="✓ "+p[1]+" unlocked after exact Base settlement.";return}}throw Error("confirmation timeout")}catch(e){status.textContent="Unlock not completed: "+e.message}}
document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>unlock(b.dataset.id));document.querySelectorAll("[data-object]").forEach(b=>b.onclick=()=>status.textContent="Object function active: "+b.dataset.object+" (software simulation).");
</script></body></html>
